<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Manager — im.jjzz</title>
<style>
:root{
  --bg:#f4f5f8;
  --panel:#fff;
  --ink:#10131a;
  --muted:#747b88;
  --line:#dfe3eb;
  --blue:#173f7a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Apple SD Gothic Neo",sans-serif;
  color:var(--ink);
  background:var(--bg);
}
button,input,textarea,select{font:inherit}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;
  gap:20px;padding:18px 28px;
  background:rgba(244,245,248,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.brand{font-weight:800;color:var(--blue)}
.top-actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{
  appearance:none;border:1px solid var(--line);
  border-radius:999px;background:#fff;color:var(--ink);
  padding:11px 16px;cursor:pointer;font-weight:650;font-size:12px;
}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:#a21c1c}
.layout{
  display:grid;grid-template-columns:330px minmax(0,1fr);
  min-height:calc(100vh - 72px);
}
.sidebar{
  padding:24px;border-right:1px solid var(--line);
  background:#eef0f5;
}
.sidebar-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.sidebar h1{font-size:16px;margin:0}
.project-list{display:flex;flex-direction:column;gap:8px}
.project-item{
  width:100%;text-align:left;border:1px solid transparent;
  background:transparent;border-radius:14px;padding:13px 14px;
  cursor:pointer;
}
.project-item.active{
  background:#fff;border-color:var(--line);box-shadow:0 8px 30px rgba(20,30,50,.06)
}
.project-item strong{display:block;font-size:14px}
.project-item span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}
.editor{padding:30px;max-width:1100px;width:100%;margin:0 auto}
.editor-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;margin-bottom:24px
}
.editor-head h2{margin:0;font-size:30px;letter-spacing:-.04em}
.editor-head p{margin:7px 0 0;color:var(--muted);font-size:13px}
.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:22px;margin-bottom:18px;
}
.panel h3{margin:0 0 18px;font-size:13px;letter-spacing:.08em;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:11px;color:var(--muted)}
input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:11px;
  background:#fff;padding:12px 13px;color:var(--ink);outline:none
}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.hint{font-size:10px;color:var(--muted);line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:10px}
.check{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:999px;padding:10px 13px;
  background:#fafbfc;font-size:12px;color:var(--ink)
}
.check input{width:auto}
.preview{
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#111
}
.preview img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.status{
  position:fixed;right:22px;bottom:22px;
  background:#111;color:#fff;border-radius:999px;padding:12px 17px;
  font-size:12px;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:.2s
}
.status.show{opacity:1;transform:none}
.empty{
  display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--muted)
}
code{background:#edf0f5;padding:2px 5px;border-radius:5px}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .sidebar{border-right:0;border-bottom:1px solid var(--line)}
  .project-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid,.grid.three{grid-template-columns:1fr}
}

.asset-picker{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
}
.asset-picker input[type="file"]{
  padding:10px;
  background:#fafbfc;
}
.asset-preview-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}
.asset-preview-card{
  position:relative;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#f7f8fb;
}
.asset-preview-card img{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
}
.asset-preview-card span{
  display:block;
  padding:8px 9px;
  font-size:10px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.asset-preview-card button{
  position:absolute;
  top:6px;
  right:6px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:#fff;
  cursor:pointer;
}
.asset-summary{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  padding:12px 14px;
  margin-top:12px;
  border:1px dashed var(--line);
  border-radius:12px;
  background:#fafbfc;
  font-size:11px;
  color:var(--muted);
}
@media(max-width:700px){
  .asset-preview-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">im.jjzz — PROJECT MANAGER</div>
  <div class="top-actions">
    <button class="btn" id="downloadAssetsButton">DOWNLOAD SELECTED IMAGES</button>
    <button class="btn" id="resetDraftButton">RESET DRAFT</button>
    <button class="btn" id="copyButton">COPY projects.js</button>
    <button class="btn primary" id="downloadButton">DOWNLOAD projects.js</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1>PROJECTS</h1>
      <button class="btn primary" id="addButton">+ ADD</button>
    </div>
    <div id="projectList" class="project-list"></div>
  </aside>

  <main id="editor" class="editor"></main>
</div>

<div id="status" class="status"></div>

<script src="projects.js"></script>
<script>
const roleOptions = [
    'Director',
    'Production',
    'Director of Photography',
    'Camera Crew',
    'Event Broadcasting',
    'Color Grading',
    'DIT'
];
const sourceProjects =
  Array.isArray(window.projects)
    ? window.projects
    : (typeof projects !== 'undefined' && Array.isArray(projects) ? projects : []);
let data = JSON.parse(JSON.stringify(sourceProjects));
let selectedIndex = data.length ? 0 : -1;
const selectedAssets = new Map();

const listEl = document.getElementById('projectList');
const editorEl = document.getElementById('editor');
const statusEl = document.getElementById('status');

function toast(message){
  statusEl.textContent = message;
  statusEl.classList.add('show');
  setTimeout(() => statusEl.classList.remove('show'), 1800);
}

function esc(value=''){
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

function slugify(value){
  return value
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9가-힣]+/g,'-')
    .replace(/^-+|-+$/g,'') || `project-${Date.now()}`;
}

function normalizeProject(project={}){
  return {
    id: project.id || '',
    title: project.title || '',
    year: project.year || '',
    type: project.type || 'Short Film',
    duration: project.duration || '',
   roles: [...new Set(
      (Array.isArray(project.roles)
        ? project.roles
        : (Array.isArray(project.worksRole) ? project.worksRole : [])
      ).map(role =>
        ['Assistant Director', 'Production Assistant', 'Production Department', '연출부'].includes(role)
          ? 'Production'
          : role
      )
    )],
    thumbnail: project.thumbnail || '',
    hero: project.hero || project.heroImage || '',
    video: project.video || project.watch?.embed || '',
    videoUrl: project.videoUrl || project.watch?.youtube || project.watch?.instagram || '',
    videoUrls: Array.isArray(project.videoUrls)
      ? project.videoUrls
      : (project.videoUrl ? [project.videoUrl] : []),
    description: project.description || '',
    roleDetail: project.roleDetail || '',
    contribution: Array.isArray(project.contribution) ? project.contribution : [],
    camera: project.camera || '',
    lens: project.lens || '',
    format: project.format || '',
    featured: Boolean(project.featured),
    credits: Array.isArray(project.credits) ? project.credits : [],
    stills: Array.isArray(project.stills)
      ? project.stills
      : (Array.isArray(project.gallery) ? project.gallery : [])
  };
}
data = data.map(normalizeProject);


const ADMIN_STORAGE_KEY = 'imjjzz-admin-projects-v1';

function saveDraftToStorage(){
  try{
    localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(data));
  }catch(error){
    console.warn('Could not save admin draft:', error);
  }
}

function restoreDraftFromStorage(){
  try{
    const saved = localStorage.getItem(ADMIN_STORAGE_KEY);
    if(!saved) return false;
    const parsed = JSON.parse(saved);
    if(!Array.isArray(parsed)) return false;
    data = parsed.map(normalizeProject);
    selectedIndex = data.length ? 0 : -1;
    return true;
  }catch(error){
    console.warn('Could not restore admin draft:', error);
    return false;
  }
}

function renderList(){
  listEl.innerHTML = data.map((project,index) => `
    <button class="project-item ${index===selectedIndex?'active':''}" data-index="${index}">
      <strong>${esc(project.title || 'Untitled Project')}</strong>
      <span>${esc(project.type)} · ${esc(project.year || 'Year')}</span>
    </button>
  `).join('');

  listEl.querySelectorAll('.project-item').forEach(button => {
    button.addEventListener('click', () => {
      saveCurrent();
      selectedIndex = Number(button.dataset.index);
      render();
    });
  });
}

function splitLines(value){
  return value.split('\n').map(v=>v.trim()).filter(Boolean);
}

function parseCredits(value){
  return splitLines(value).map(line => {
    const separator = line.includes('|') ? '|' : ':';
    const [role,...rest] = line.split(separator);
    return [role.trim(), rest.join(separator).trim()];
  }).filter(row => row[0] || row[1]);
}

function saveCurrent(){
  if(selectedIndex < 0 || !editorEl.querySelector('[data-field]')) return;
  const project = data[selectedIndex];

  editorEl.querySelectorAll('[data-field]').forEach(input => {
    const field = input.dataset.field;
    if(input.type === 'checkbox' && field === 'featured'){
      project.featured = input.checked;
    } else if(field === 'roles'){
      project.roles = [...editorEl.querySelectorAll('[data-role]:checked')].map(el=>el.value);
    } else if(field === 'contribution'){
      project.contribution = splitLines(input.value);
    } else if(field === 'credits'){
      project.credits = parseCredits(input.value);
    } else if(field === 'stills'){
      project.stills = splitLines(input.value);
    } else if(field === 'videoUrls'){
      project.videoUrls = splitLines(input.value).slice(0,4);
      project.videoUrl = project.videoUrls[0] || '';
    } else {
      project[field] = input.value.trim();
    }
  });

  if(!project.id) project.id = slugify(project.title);
  saveDraftToStorage();
}


function safeExtension(fileName){
  const match = fileName.toLowerCase().match(/\.(jpg|jpeg|png|webp|gif)$/);
  if(!match) return 'jpg';
  return match[1] === 'jpeg' ? 'jpg' : match[1];
}

function currentProjectId(){
  const project = data[selectedIndex];
  return slugify(project?.id || project?.title || `project-${selectedIndex+1}`);
}

function registerAsset(file, targetName){
  const ext = safeExtension(file.name);
  const finalName = `${targetName}.${ext}`;
  selectedAssets.set(finalName, file);
  return `assets/${finalName}`;
}

function renderAssetPreviews(){
  const container = document.getElementById('assetPreviewList');
  const summary = document.getElementById('assetSummaryText');
  if(!container || !summary) return;

  const items = [...selectedAssets.entries()];
  summary.textContent = items.length
    ? `새 이미지 ${items.length}개 선택됨`
    : '선택된 새 이미지 없음';

  container.innerHTML = items.map(([name,file]) => {
    const url = URL.createObjectURL(file);
    return `
      <div class="asset-preview-card" data-asset-name="${esc(name)}">
        <button type="button" data-remove-asset="${esc(name)}">×</button>
        <img src="${url}" alt="">
        <span>${esc(name)}</span>
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-remove-asset]').forEach(button => {
    button.addEventListener('click', () => {
      selectedAssets.delete(button.dataset.removeAsset);
      renderAssetPreviews();
      toast('Image removed');
    });
  });
}

function bindAssetPickers(){
  const thumbnailFile = document.getElementById('thumbnailFile');
  const heroFile = document.getElementById('heroFile');
  const stillsFiles = document.getElementById('stillsFiles');
  const thumbnailPath = document.getElementById('thumbnailPath');
  const heroPath = document.getElementById('heroPath');
  const stillsPath = document.getElementById('stillsPath');

  if(thumbnailFile){
    thumbnailFile.addEventListener('change', () => {
      const file = thumbnailFile.files[0];
      if(!file) return;
      const path = registerAsset(file, `${currentProjectId()}-thumb`);
      thumbnailPath.value = path;
      thumbnailPath.dispatchEvent(new Event('input', {bubbles:true}));
      renderAssetPreviews();
    });
  }

  if(heroFile){
    heroFile.addEventListener('change', () => {
      const file = heroFile.files[0];
      if(!file) return;
      const path = registerAsset(file, `${currentProjectId()}-hero`);
      heroPath.value = path;
      heroPath.dispatchEvent(new Event('input', {bubbles:true}));
      renderAssetPreviews();
    });
  }

  if(stillsFiles){
    stillsFiles.addEventListener('change', () => {
      const files = [...stillsFiles.files];
      if(!files.length) return;

      const existing = splitLines(stillsPath.value);
      const newPaths = files.map((file,index) => {
        const number = String(existing.length + index + 1).padStart(2,'0');
        return registerAsset(file, `${currentProjectId()}-still-${number}`);
      });

      stillsPath.value = [...existing, ...newPaths].join('\n');
      stillsPath.dispatchEvent(new Event('input', {bubbles:true}));
      renderAssetPreviews();
    });
  }

  renderAssetPreviews();
}

function downloadSelectedAssets(){
  if(!selectedAssets.size){
    toast('선택된 이미지가 없어.');
    return;
  }

  [...selectedAssets.entries()].forEach(([name,file],index) => {
    setTimeout(() => {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }, index * 250);
  });

  toast(`${selectedAssets.size} image files downloading`);
}

function renderEditor(){
  if(selectedIndex < 0){
    editorEl.innerHTML = `<div class="empty"><div><h2>No projects yet.</h2><p>왼쪽의 <strong>+ ADD</strong>를 눌러 첫 작품을 추가해.</p></div></div>`;
    return;
  }

  const p = data[selectedIndex];
  const creditText = (p.credits||[]).map(row => row.join(' | ')).join('\n');
  const stillText = (p.stills||[]).join('\n');
  const contributionText = (p.contribution||[]).join('\n');
  const videoUrlsText = (p.videoUrls && p.videoUrls.length ? p.videoUrls : (p.videoUrl ? [p.videoUrl] : [])).join('\n');

  editorEl.innerHTML = `
    <div class="editor-head">
      <div>
        <h2>${esc(p.title || 'Untitled Project')}</h2>
        <p>수정 내용은 자동으로 임시 저장돼. 끝나면 projects.js를 내려받아 기존 파일과 교체하면 돼.</p>
      </div>
      <button class="btn danger" id="deleteButton">DELETE</button>
    </div>

    <section class="panel">
      <h3>BASIC INFORMATION</h3>
      <div class="grid three">
        <div class="field"><label>작품명</label><input data-field="title" value="${esc(p.title)}"></div>
        <div class="field"><label>ID · 영어 소문자 권장</label><input data-field="id" value="${esc(p.id)}"></div>
        <div class="field"><label>연도</label><input data-field="year" value="${esc(p.year)}"></div>
        <div class="field"><label>형식</label><input data-field="type" value="${esc(p.type)}" placeholder="Short Film"></div>
        <div class="field"><label>러닝타임</label><input data-field="duration" value="${esc(p.duration)}" placeholder="18 min"></div>
        <div class="field">
          <label>Featured</label>
          <label class="check"><input type="checkbox" data-field="featured" ${p.featured?'checked':''}> Work에서 우선 노출</label>
        </div>
      </div>
    </section>

    <section class="panel">
      <h3>ROLE</h3>
      <div class="checks">
        ${roleOptions.map(role => `
          <label class="check">
            <input type="checkbox" data-field="roles" data-role value="${role}" ${p.roles.includes(role)?'checked':''}>
            ${role}
          </label>
        `).join('')}
      </div>
      <div class="field" style="margin-top:16px">
        <label>상세 역할 설명</label>
        <textarea data-field="roleDetail" placeholder="Camera Crew / Camera Operation">${esc(p.roleDetail)}</textarea>
      </div>
      <div class="field" style="margin-top:16px">
        <label>세부 기여도 · 한 줄에 하나</label>
        <textarea data-field="contribution" placeholder="Camera Operation&#10;Lighting Setup&#10;Color Grading">${esc(contributionText)}</textarea>
      </div>
    </section>

    <section class="panel">
      <h3>MEDIA</h3>

      <div class="grid">
        <div class="field">
          <label>Work 썸네일 선택</label>
          <div class="asset-picker">
            <input id="thumbnailFile" type="file" accept="image/*">
          </div>
          <span class="hint">선택하면 파일명을 정리하고 경로를 자동 입력해.</span>
        </div>

        <div class="field">
          <label>상세 대표 이미지 선택</label>
          <div class="asset-picker">
            <input id="heroFile" type="file" accept="image/*">
          </div>
          <span class="hint">썸네일과 같은 사진이어도 괜찮아.</span>
        </div>

        <div class="field">
          <label>Work 썸네일 경로</label>
          <input id="thumbnailPath" data-field="thumbnail" value="${esc(p.thumbnail)}" placeholder="assets/project-thumb.jpg">
        </div>

        <div class="field">
          <label>상세 대표 이미지 경로</label>
          <input id="heroPath" data-field="hero" value="${esc(p.hero)}" placeholder="assets/project-hero.jpg">
        </div>

        <div class="field">
          <label>YouTube/Vimeo 임베드 주소</label>
          <input data-field="video" value="${esc(p.video)}" placeholder="https://www.youtube.com/embed/...">
        </div>

        <div class="field full">
          <label>외부 영상 주소 · 한 줄에 하나, 최대 4개</label>
          <textarea data-field="videoUrls" placeholder="https://youtu.be/영상1&#10;https://youtu.be/영상2&#10;https://youtu.be/영상3&#10;https://youtu.be/영상4">${esc(videoUrlsText)}</textarea>
          <span class="hint">여러 링크는 한 줄에 하나씩 입력해. 첫 번째 링크는 기존 videoUrl에도 자동 저장돼.</span>
        </div>

        <div class="field full">
          <label>스틸컷 여러 장 선택</label>
          <input id="stillsFiles" type="file" accept="image/*" multiple>
          <span class="hint">여러 장을 한 번에 선택할 수 있어. 파일명과 경로가 자동 생성돼.</span>
        </div>

        <div class="field full">
          <label>스틸컷 경로 · 한 줄에 하나</label>
          <textarea id="stillsPath" data-field="stills" placeholder="assets/still01.jpg&#10;assets/still02.jpg">${esc(stillText)}</textarea>
        </div>
      </div>

      <div id="assetPreviewList" class="asset-preview-list"></div>
      <div class="asset-summary">
        <span id="assetSummaryText">선택된 새 이미지 없음</span>
        <span>다운로드 후 사이트의 <strong>assets</strong> 폴더에 넣어줘.</span>
      </div>

      ${p.thumbnail ? `<div class="preview" style="margin-top:18px"><img src="${esc(p.thumbnail)}" alt=""></div>` : ''}
    </section>

    <section class="panel">
      <h3>DESCRIPTION & CREDITS</h3>
      <div class="field">
        <label>작품 설명</label>
        <textarea data-field="description">${esc(p.description)}</textarea>
      </div>
      <div class="field" style="margin-top:16px">
        <label>크레딧 · 한 줄에 하나, <code>직책 | 이름</code></label>
        <textarea data-field="credits" placeholder="Director | 강예현&#10;DOP | 신혜원&#10;Camera Crew | 전지원 (im.jjzz)">${esc(creditText)}</textarea>
      </div>
    </section>

    <section class="panel">
      <h3>TECHNICAL</h3>
      <div class="grid three">
        <div class="field"><label>Camera</label><input data-field="camera" value="${esc(p.camera)}" placeholder="Sony FX3"></div>
        <div class="field"><label>Lens</label><input data-field="lens" value="${esc(p.lens)}" placeholder="Sigma 24–70mm"></div>
        <div class="field"><label>Format</label><input data-field="format" value="${esc(p.format)}" placeholder="4K XAVC S-I"></div>
      </div>
    </section>
  `;

  editorEl.querySelectorAll('input,textarea').forEach(input => {
    input.addEventListener('input', () => {
      saveCurrent();
      if(input.dataset.field === 'title'){
        editorEl.querySelector('.editor-head h2').textContent = input.value || 'Untitled Project';
      }
    });
  });

  bindAssetPickers();

  document.getElementById('deleteButton').addEventListener('click', () => {
    if(!confirm(`"${p.title || '이 작품'}"을 목록에서 삭제할까?`)) return;
    data.splice(selectedIndex,1);
    selectedIndex = Math.min(selectedIndex,data.length-1);
    render();
    toast('Project deleted');
  });
}

function render(){
  renderList();
  renderEditor();
}

document.getElementById('addButton').addEventListener('click', () => {
  saveCurrent();
  data.push(normalizeProject({
    id:`project-${Date.now()}`,
    title:'New Project',
    year:new Date().getFullYear().toString(),
    type:'Short Film'
  }));
  selectedIndex = data.length-1;
  render();
});

function serialize(){
  saveCurrent();
  const payload = JSON.stringify(data,null,2);
  return 'const projects = ' + payload + ';\nwindow.projects = projects;\n';
}

document.getElementById('downloadButton').addEventListener('click', () => {
  const blob = new Blob([serialize()], {type:'text/javascript;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'projects.js';
  a.click();
  URL.revokeObjectURL(url);
  toast('projects.js downloaded');
});

document.getElementById('copyButton').addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(serialize());
    toast('Copied to clipboard');
  }catch{
    toast('브라우저가 복사를 막았어. Download를 사용해.');
  }
});

document.getElementById('downloadAssetsButton').addEventListener('click', downloadSelectedAssets);

document.getElementById('resetDraftButton').addEventListener('click', () => {
  if(!confirm('임시 저장된 수정 내용을 지우고 현재 projects.js 데이터로 되돌릴까?')) return;
  localStorage.removeItem(ADMIN_STORAGE_KEY);
  location.reload();
});


window.addEventListener('beforeunload', saveCurrent);
restoreDraftFromStorage();
render();
</script>
</body>
</html>

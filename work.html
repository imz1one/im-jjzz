<script>
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('workGrid');
  const filterWrap = document.getElementById('workFilters');

  const roleOrder = ['Director of Photography', 'Camera Crew', 'Color Grading', 'DIT', 'Production', 'Event Broadcasting'];
  const availableRoles = new Set(
    projects.flatMap(project => project.roles)
  );

  const filters = [
    { label: 'ALL PROJECTS', value: 'all' },
    ...roleOrder
      .filter(role => availableRoles.has(role))
      .map(role => ({
        label: role === 'Director of Photography' ? 'DIRECTOR OF PHOTOGRAPHY' : role.toUpperCase(),
        value: role.toLowerCase().replace(/\s+/g, '-')
      }))
  ];

  const renderFilters = () => {
    filterWrap.innerHTML = filters.map((filter, index) => `
      <button
        class="work-filter ${index === 0 ? 'active' : ''}"
        data-filter="${filter.value}"
        type="button"
      >
        ${filter.label}
      </button>
    `).join('');
  };

  const roleSlug = role =>
    role.toLowerCase().replace(/\s+/g, '-');

  const compactRole = role => {
    const labels = {
      'Director of Photography': 'DOP',
      'Camera Crew': 'Camera Crew',
      'Color Grading': 'Color Grading',
      'DIT': 'DIT',
      'Production': 'Production',
      'Event Broadcasting': 'Event Broadcasting'
    };
    return labels[role] || role;
  };

  const parseProjectDate = value => {
    const date = new Date(`1 ${value}`);
    return Number.isNaN(date.getTime()) ? 0 : date.getTime();
  };

  const renderProjects = (activeFilter = 'all') => {
    const visibleProjects = [...projects]
      .sort((a, b) =>
        Number(Boolean(b.featured)) - Number(Boolean(a.featured)) ||
        parseProjectDate(b.year) - parseProjectDate(a.year)
      )
      .filter(project =>
        activeFilter === 'all' ||
        project.roles.some(role => roleSlug(role) === activeFilter)
      );

    grid.innerHTML = visibleProjects.map((project, index) => `
      <article class="work-card show" style="animation-delay:${index * 60}ms">
        <a href="project.html?id=${encodeURIComponent(project.id)}" class="work-thumb" aria-label="View ${project.title} project">
          <img src="${project.thumbnail}" alt="${project.title} project still" loading="lazy">
        </a>
        <div class="work-card-info">
          <h2>${project.title}</h2>
          <p class="work-meta-line">${project.type} · ${project.year}</p>
          <p class="work-role-line">${project.roles.map(compactRole).join(' / ')}</p>
        </div>
      </article>
    `).join('');
  };

  renderFilters();
  renderProjects();

  filterWrap.addEventListener('click', event => {
    const button = event.target.closest('.work-filter');
    if (!button) return;

    document.querySelectorAll('.work-filter').forEach(item =>
      item.classList.remove('active')
    );
    button.classList.add('active');

    renderProjects(button.dataset.filter);
  });
});
</script>

const showcaseProgress=document.getElementById("showcaseProgress");
let showcaseCurrent=0;

function restartProgress(){
  showcaseProgress.classList.remove("running");
  void showcaseProgress.offsetWidth;
  showcaseProgress.classList.add("running");
}
function setShowcaseSlide(index){
  showcaseSlides.forEach((slide,i)=>slide.classList.toggle("active",i===index));
  const slide=showcaseSlides[index];
  showcaseTitle.textContent=slide.dataset.title;
  showcaseRole.textContent=slide.dataset.role;
  showcaseIndex.textContent=String(index+1).padStart(2,"0")+" / "+String(showcaseSlides.length).padStart(2,"0");
  restartProgress();
}
let showcaseTimer;
function startShowcase(){
  clearInterval(showcaseTimer);
  showcaseTimer=setInterval(()=>{
    showcaseCurrent=(showcaseCurrent+1)%showcaseSlides.length;
    setShowcaseSlide(showcaseCurrent);
  },5000);
}
const showcaseElement=document.getElementById("showcase");
showcaseElement.addEventListener("mouseenter",()=>clearInterval(showcaseTimer));
showcaseElement.addEventListener("mouseleave",startShowcase);
showcaseElement.addEventListener("click",()=>{
  showcaseCurrent=(showcaseCurrent+1)%showcaseSlides.length;
  setShowcaseSlide(showcaseCurrent);
  startShowcase();
});
setShowcaseSlide(0);
startShowcase();


const siteHeader=document.querySelector("header");
function updateHeader(){
  siteHeader.classList.toggle("header-scrolled",window.scrollY>24);
}
window.addEventListener("scroll",updateHeader,{passive:true});
updateHeader();

</script></body></html>

/* v8.6 shared refinements */
header{
  transition:
    padding .35s ease,
    background-color .35s ease,
    backdrop-filter .35s ease,
    box-shadow .35s ease;
}
header.header-scrolled{
  padding-top:10px;
  padding-bottom:10px;
  background:rgba(242,242,245,.94);
  backdrop-filter:blur(24px);
  box-shadow:0 8px 30px rgba(16,24,39,.055);
}
header .brand,
header nav{
  transition:transform .35s ease, opacity .35s ease;
}

main{

<script src="projects.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const index = projects.findIndex(item => item.id === id);
  const project = projects[index];

  if (!project) {
    document.querySelector('main').innerHTML =
      '<section style="min-height:70vh;display:grid;place-items:center;text-align:center"><div><h1>Project not found.</h1><a href="work.html">Back to Work</a></div></section>';
    return;
  }

  const titleEl = document.getElementById('projectTitle');
  const metaEl = document.getElementById('projectMeta');
  const durationEl = document.getElementById('projectDuration');
  const roleEl = document.getElementById('projectRoleDetail');
  const descriptionEl = document.getElementById('projectDescription');
  const heroImage = document.getElementById('projectHeroImage');
  const heroButton = document.getElementById('projectHeroButton');
  const stillsEl = document.getElementById('projectStills');

  document.title = `${project.title} — im.jjzz`;
  titleEl.textContent = project.title;
  metaEl.textContent = [project.type, project.year, project.duration].filter(Boolean).join(' · ');
  durationEl.textContent = '';
  durationEl.hidden = true;
  roleEl.textContent = project.roleDetail || (project.roles || []).join(' / ');
  descriptionEl.textContent = project.description || '';

  const heroSrc = project.hero || project.heroImage || project.thumbnail || '';
  const stills = Array.isArray(project.stills) ? project.stills.filter(Boolean) : [];
  const galleryImages = [heroSrc, ...stills.filter(src => src !== heroSrc)].filter(Boolean);
  let activeVisualIndex = 0;

  const setHero = (src, visualIndex = 0) => {
    heroImage.src = src;
    heroImage.alt = `${project.title} project still`;
    activeVisualIndex = visualIndex;
    stillsEl.querySelectorAll('.project-thumb-button').forEach((button, i) => {
      button.classList.toggle('active', i === visualIndex);
      button.setAttribute('aria-current', i === visualIndex ? 'true' : 'false');
    });
  };

  stillsEl.innerHTML = galleryImages.map((src, i) => `
    <button class="project-thumb-button ${i === 0 ? 'active' : ''}" type="button" data-index="${i}" aria-label="View still ${i + 1}">
      <img loading="${i < 5 ? 'eager' : 'lazy'}" decoding="async" src="${src}" alt="${project.title} thumbnail ${i + 1}">
    </button>
  `).join('');

  if (heroSrc) setHero(heroSrc, 0);

  stillsEl.addEventListener('click', event => {
    const button = event.target.closest('.project-thumb-button');
    if (!button) return;
    const i = Number(button.dataset.index);
    setHero(galleryImages[i], i);
    button.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  });

  const thumbRow = stillsEl;
  const scrollThumbs = direction => {
    thumbRow.scrollBy({left: direction * Math.max(260, thumbRow.clientWidth * .72), behavior:'smooth'});
  };
  document.getElementById('projectThumbPrev').addEventListener('click', () => scrollThumbs(-1));
  document.getElementById('projectThumbNext').addEventListener('click', () => scrollThumbs(1));

  const videoUrlList = Array.isArray(project.videoUrls) && project.videoUrls.length
    ? project.videoUrls.slice(0, 4)
    : (project.videoUrl ? [project.videoUrl] : []);

  const watchLinks = videoUrlList.length
    ? videoUrlList.map(url => ({url}))
    : (project.links && project.links.length ? project.links : []);

  const platformName = url => {
    const value = String(url || '').toLowerCase();
    if (value.includes('youtube.com') || value.includes('youtu.be')) return 'YOUTUBE';
    if (value.includes('instagram.com')) return 'INSTAGRAM';
    if (value.includes('vimeo.com')) return 'VIMEO';
    if (value.includes('drive.google.com')) return 'GOOGLE DRIVE';
    return 'WATCH';
  };

  const platformCounts = watchLinks.reduce((counts, link) => {
    const platform = platformName(link.url);
    counts[platform] = (counts[platform] || 0) + 1;
    return counts;
  }, {});

  const platformIndexes = {};
  document.getElementById('projectWatchLinks').innerHTML = watchLinks.map(link => {
    const platform = platformName(link.url);
    platformIndexes[platform] = (platformIndexes[platform] || 0) + 1;
    const number = platformCounts[platform] > 1
      ? ` ${String(platformIndexes[platform]).padStart(2, '0')}`
      : '';
    return `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${platform}${number} ↗</a>`;
  }).join('');

  const credits = Array.isArray(project.credits) ? project.credits : [];
  const creditSection = document.getElementById('projectCreditsSection');
  if (!credits.length) {
    creditSection.hidden = true;
  } else {
    document.getElementById('projectCredits').innerHTML = credits.map(([role, name]) => {
      const formatted = String(name).replace(/\(im\.jjzz\)/g,'<span class="credit-handle">(im.jjzz)</span>');
      return `<div class="credit-row"><span>${role}</span><span>${formatted}</span></div>`;
    }).join('');
  }

  const technicalRows = [
    ['Camera', project.camera],
    ['Lens', project.lens],
    ['Filter', project.filter],
    ['Format', project.format],
    ['Color', project.color],
    ['Aspect Ratio', project.aspectRatio],
  ].filter(([, value]) => String(value || '').trim());

  if (project.contribution && project.contribution.length) {
    technicalRows.push(['Contribution', project.contribution.join(' / ')]);
  }

  if (technicalRows.length) {
    const technicalMarkup = technicalRows.map(([label, value]) => `
      <div class="project-tech-row"><span>${label}</span><span>${String(value)}</span></div>
    `).join('');

    const desktopSection = document.getElementById('projectTechnicalSectionDesktop');
    const mobileSection = document.getElementById('projectTechnicalSectionMobile');
    const desktopContent = document.getElementById('projectTechnicalDesktop');
    const mobileContent = document.getElementById('projectTechnicalMobile');

    if (desktopSection && desktopContent) {
      desktopSection.hidden = false;
      desktopContent.innerHTML = technicalMarkup;
    }

    if (mobileSection && mobileContent) {
      mobileSection.hidden = false;
      mobileContent.innerHTML = technicalMarkup;
    }
  }

  const previous = projects[(index - 1 + projects.length) % projects.length];
  const next = projects[(index + 1) % projects.length];

  const previousLink = document.getElementById('previousProject');
  previousLink.href = `project.html?id=${encodeURIComponent(previous.id)}`;
  document.getElementById('previousProjectTitle').textContent = previous.title;

  const nextLink = document.getElementById('nextProject');
  nextLink.href = `project.html?id=${encodeURIComponent(next.id)}`;
  document.getElementById('nextProjectTitle').textContent = next.title;

  const lightbox = document.getElementById('projectLightbox');
  const lightboxImage = document.getElementById('lightboxImage');

  const openLightbox = () => {
    if (!galleryImages.length) return;
    lightboxImage.src = galleryImages[activeVisualIndex];
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  };

  const showImage = offset => {
    if (!galleryImages.length) return;
    activeVisualIndex = (activeVisualIndex + offset + galleryImages.length) % galleryImages.length;
    lightboxImage.src = galleryImages[activeVisualIndex];
    setHero(galleryImages[activeVisualIndex], activeVisualIndex);
  };

  const closeLightbox = () => {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  };

  document.getElementById('projectHeroZoom').addEventListener('click', openLightbox);
  document.getElementById('projectHeroPrev').addEventListener('click', () => {
    if (!galleryImages.length) return;
    activeVisualIndex = (activeVisualIndex - 1 + galleryImages.length) % galleryImages.length;
    setHero(galleryImages[activeVisualIndex], activeVisualIndex);
  });
  document.getElementById('projectHeroNext').addEventListener('click', () => {
    if (!galleryImages.length) return;
    activeVisualIndex = (activeVisualIndex + 1) % galleryImages.length;
    setHero(galleryImages[activeVisualIndex], activeVisualIndex);
  });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', () => showImage(-1));
  document.getElementById('lightboxNext').addEventListener('click', () => showImage(1));

  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', event => {
    if (!lightbox.classList.contains('open')) return;
    if (event.key === 'Escape') closeLightbox();
    if (event.key === 'ArrowLeft') showImage(-1);
    if (event.key === 'ArrowRight') showImage(1);
  });
});
</script>
